version: '3.8'

services:
  # -----------------------
  # 1. CORE DATABASES
  # -----------------------
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpassword
      POSTGRES_DB: smartgrade_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # -----------------------
  # 2. PYTHON BACKENDS
  # -----------------------
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://smartuser:smartpassword@postgres:5432/smartgrade_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - ENCRYPTION_KEY=jp-iL7w02syAjwfzVYoH8qVHwJT2na3wGHqXjM1c5aY=
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant

  celery_worker:
    build: 
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info"]
    restart: always
    environment:
      - DATABASE_URL=postgresql://smartuser:smartpassword@postgres:5432/smartgrade_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - ENCRYPTION_KEY=jp-iL7w02syAjwfzVYoH8qVHwJT2na3wGHqXjM1c5aY=
    depends_on:
      - postgres
      - redis
      - backend

  # -----------------------
  # 3. REACT FRONTEND
  # -----------------------
  frontend:
    build:
      context: ./smartgrade-frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
